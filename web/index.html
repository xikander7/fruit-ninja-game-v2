<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0a0808">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Hanifa, the Fruit Ninja</title>
<link rel="icon" href="favicon.png">
<style>
  html, body { margin: 0; height: 100%; background: #0a0808; overflow: hidden; overscroll-behavior: none; }
  body { position: fixed; inset: 0; color: #e2b65c; font-family: Georgia, "Times New Roman", serif;
         -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  #game { display: block; touch-action: none; cursor: none; background: #0a0808; }
  #boot { position: fixed; inset: 0; z-index: 10; background: #0a0808; display: flex; flex-direction: column;
          align-items: center; justify-content: center; gap: 22px; text-align: center; transition: opacity .4s; }
  #boot.gone { opacity: 0; pointer-events: none; }
  #boot h1 { margin: 0; font-weight: 700; font-size: clamp(34px, 7vw, 72px); letter-spacing: .04em; color: #ece4d2; }
  #boot p { margin: 0; font-size: clamp(11px, 2vw, 14px); letter-spacing: .5em; text-indent: .5em; color: #e2b65c; }
  #track { width: min(320px, 60vw); height: 2px; background: rgba(236, 228, 210, .18); }
  #bar { width: 0; height: 100%; background: #e2b65c; transition: width .15s; }
  #status { min-height: 1.2em; margin: 0; font-size: 14px; letter-spacing: .08em; color: #968a78; }
  #buttons { display: flex; flex-direction: column; gap: 12px; align-items: center; }
  #buttons[hidden] { display: none; }
  button { font: 22px Georgia, "Times New Roman", serif; letter-spacing: .12em; color: #e2b65c; background: #0a0808;
           border: 1px solid #e2b65c; padding: 14px 40px; min-width: 240px; cursor: pointer; }
  button:hover, button:focus-visible { background: #e2b65c; color: #0a0808; outline: none; }
  #fs { font-size: 15px; padding: 10px 28px; border-color: rgba(226, 182, 92, .45); }
  #game.turned { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%) rotate(90deg); }
</style>
</head>
<body>
<div id="stage"><canvas id="game" width="1280" height="720"></canvas></div>
<div id="boot">
  <h1>Hanifa</h1>
  <p>THE FRUIT NINJA</p>
  <div id="track"><div id="bar"></div></div>
  <p id="status">Sharpening the blade…</p>
  <div id="buttons" hidden>
    <button id="play">Play</button>
    <button id="fs">Play fullscreen</button>
  </div>
</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
